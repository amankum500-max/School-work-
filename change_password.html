{% extends "base.html" %}
{% block content %}
<h2>🔐 Change Password</h2>

<div class="card" style="max-width: 420px; margin: 20px auto;">
  <form method="POST">
    <label style="font-weight:bold;">Old Password:</label>
    <input type="password" name="old_password" placeholder="Enter old password" required>

    <label style="font-weight:bold;">New Password:</label>
    <input type="password" name="new_password" placeholder="Min 6 characters" required>

    <label style="font-weight:bold;">Confirm New Password:</label>
    <input type="password" name="confirm_password" placeholder="Re-enter new password" required>

    <button class="green" style="width:100%; margin-top:10px;">💾 Change Password</button>
  </form>
</div>
{% endblock %}
